    <div className="min-h-[100dvh] lg:grid lg:grid-cols-[240px_minmax(0,1fr)]">
      {env === 'prod' && <div className="lg:col-span-2 bg-gradient-to-r from-red-700 to-rose-700 text-white text-center font-bold py-1.5 px-4">⚠ โหมดเงินจริง (PROD) — ทุกคำสั่งที่ยืนยันจะถูกส่งไปที่บัญชีจริง</div>}
      <div className="lg:col-span-2 text-center text-[12px] font-semibold py-0.5 bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300">ตัวอย่าง v2 · ข้อมูลสมมติทั้งหมด</div>
      <header className="lg:col-span-2 sticky top-0 z-20 flex items-center gap-3 px-4 py-2.5 bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl border-b border-slate-900/10 dark:border-white/10">
        <div className="flex items-center gap-2 font-bold"><span className="w-3 h-3 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 shadow-glow" />UPVerse</div>
        <h1 className="flex-1 text-[19px] font-semibold m-0 truncate">{TITLES[page]}</h1>
        <Chip tone={env === 'prod' ? 'danger' : 'info'}>{env.toUpperCase()}</Chip>
        <button aria-label="สลับธีม" onClick={() => setTheme(isDark() ? 'light' : 'dark')} className="min-h-[40px] min-w-[40px] grid place-items-center rounded-2xl bg-white/70 dark:bg-white/5 border border-slate-900/10 dark:border-white/10 cursor-pointer"><I.moon className="w-5 h-5" /></button>
      </header>
      <nav className="hidden lg:flex flex-col gap-1 p-3 border-r border-slate-900/10 dark:border-white/10 bg-white/50 dark:bg-slate-900/40 backdrop-blur-xl sticky top-[64px] h-[calc(100dvh-64px)]" aria-label="เมนูหลัก">
        {SIDE.map((it, i) => it ? <button key={it[0]} aria-current={active === it[0] ? 'page' : undefined} onClick={() => go(it[0])} className={cx("flex items-center justify-between px-3 py-2.5 rounded-2xl text-left transition-all duration-300 cursor-pointer", active === it[0] ? "bg-gradient-to-r from-emerald-500/20 to-teal-500/10 font-semibold" : "text-slate-600 dark:text-slate-300 hover:bg-slate-500/10 dark:hover:bg-white/5")}>{it[1]}{it[0] === 'tickets' && <Chip tone="danger">2</Chip>}</button> : <div key={i} className="h-px my-2 bg-slate-900/10 dark:bg-white/10" />)}
      </nav>
      <main className="px-4 pt-4 pb-28 lg:pb-8 lg:px-6 w-full max-w-[1200px] mx-auto min-w-0">
        <Page go={go} openSheet={() => setSheet(true)} theme={theme} setTheme={setTheme} font={font} setFont={setFont} aurora={aurora} setAurora={setAurora} env={env} setEnv={setEnv} />
      </main>
      <nav className="lg:hidden fixed left-3 right-3 bottom-3 z-30 grid grid-cols-5 rounded-3xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-900/10 dark:border-white/10 shadow-soft dark:shadow-softdark" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }} aria-label="เมนูมือถือ">
        {NAV.map(([k, l, Icon]) => <button key={k} aria-current={active === k ? 'page' : undefined} onClick={() => go(k)} className={cx("relative h-[60px] flex flex-col items-center justify-center gap-0.5 text-[13px] rounded-3xl transition-colors duration-300 cursor-pointer", active === k ? "text-emerald-700 dark:text-emerald-300 font-semibold" : "text-slate-600 dark:text-slate-400")}><Icon className="w-[22px] h-[22px]" />{l}{k === 'tickets' && <span className="absolute top-2 right-[calc(50%-20px)] min-w-[18px] h-[18px] px-1 rounded-full bg-gradient-to-r from-red-600 to-rose-600 text-white text-[12px] leading-[18px] text-center">2</span>}</button>)}
      </nav>
      {sheet && <div className="fixed inset-0 z-40 bg-slate-950/55 flex items-end md:items-center justify-center" onClick={e => { if (e.target === e.currentTarget) setSheet(false); }}>
        <div className="w-full max-w-[560px] max-h-[90dvh] overflow-auto bg-white dark:bg-slate-900 rounded-t-3xl md:rounded-3xl p-4" style={{ paddingBottom: 'calc(16px + env(safe-area-inset-bottom))' }}>
          <div className="flex items-center justify-between mb-2"><h2 className="text-[17px] font-semibold m-0">บันทึกรายการ (Paper)</h2><Btn variant="ghost" small onClick={() => setSheet(false)}><I.x className="w-4 h-4" /> ปิด</Btn></div>
          <Field label="ชนิด"><select className={inputCls}><option>ซื้อ</option><option>ขาย</option><option>ปันผล</option><option>ค่าธรรมเนียม</option><option>ฝากเงิน</option><option>แลกเงิน THB→USD</option></select></Field>
          <div className="grid grid-cols-2 gap-3"><Field label="สัญลักษณ์"><input className={inputCls} defaultValue="VOO" /></Field><Field label="จำนวน (เศษได้)"><input className={cx(inputCls, "num")} defaultValue="0.123456" /></Field><Field label="ราคา (USD)"><input className={cx(inputCls, "num")} defaultValue="527.40" /></Field><Field label="ค่าธรรมเนียม"><input className={cx(inputCls, "num")} defaultValue="0.00" /></Field><Field label="FX rate ที่ใช้"><input className={cx(inputCls, "num")} defaultValue="33.27" /></Field><Field label="วันเวลา"><input className={inputCls} defaultValue="17 ก.ย. 2569 21:35" /></Field></div>
          <Field label="โน้ต"><input className={inputCls} placeholder="เช่น รอบ DCA ก.ย." /></Field>
          <div className="flex items-center justify-between gap-2"><Muted className="num">มูลค่า ≈ $65.11 · ฿2,166</Muted><Btn variant="primary">บันทึก</Btn></div>
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
